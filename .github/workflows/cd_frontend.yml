## Build docker image
## push the image to docker hub
## SSH into the vm and start the image

name: Deploy the frontend

on:
    push:
        branches: [ main ]
        paths:
            - apps/web/**
            - packages/db/**
            - packages/ui/**
            - packages/typescript-config/**
            - docker/Dockerfile.frontend
            - bun.lock
            - .github/workflows/cd_frontend.yml

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the code
              uses: actions/checkout@v4

            - name: Docker login
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                context: .
                file: docker/Dockerfile.frontend
                push: true
                tags: |
                    ${{ secrets.DOCKER_USERNAME }}/frontend:latest
                    ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}

            - name: Deploy to the VM
              run: |
                echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
                chmod 600 ~/ssh_key
                ssh -o StrictHostKeyChecking=no -i ~/ssh_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
                  set -e
                  docker pull ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}
                  docker rm -f user_frontend 2>/dev/null || true
                  docker run -d --name user_frontend --restart unless-stopped \
                    -p 3000:3000 --env-file ~/app.env \
                    ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}
                "
