## Build docker image
## push the image to docker hub
## SSH into the vm and start the image

name: Deploy the backend

on:
    push:
        branches: [ main ]
        paths:
            - apps/backend/**
            - packages/db/**
            - docker/Dockerfile.backend
            - bun.lock
            - .github/workflows/cd_backend.yml

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the code
              uses: actions/checkout@v4

            - name: Docker login
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                context: .
                file: docker/Dockerfile.backend
                push: true
                tags: |
                    ${{ secrets.DOCKER_USERNAME }}/backend:latest
                    ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}

            - name: Deploy to the VM
              run: |
                echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
                chmod 600 ~/ssh_key
                ssh -o StrictHostKeyChecking=no -i ~/ssh_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
                  set -e
                  docker pull ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}
                  docker run --rm --env-file ~/app.env -w /usr/src/app/packages/db \
                    ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }} bunx prisma db migrate
                  docker rm -f user_backend 2>/dev/null || true
                  docker run -d --name user_backend --restart unless-stopped \
                    -p 3001:3001 --env-file ~/app.env \
                    ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}
                "
